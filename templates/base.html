<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hotel Booking Website</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <div class="logo">
        HotelBook
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('hotels') }}">
            Hotels
        </a>

        {% if session.get("user_id") %}

            <a href="{{ url_for('my_bookings') }}">
                My Bookings
            </a>

            <span>
                Hello, {{ session.get("user_name") }}
            </span>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        {% else %}

            <a href="{{ url_for('login') }}">
                Login
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

        {% endif %}

    </div>

</nav>


<main>

    {% block content %}

    {% endblock %}

</main>


<footer>

    <p>
        © 2026 HotelBook
    </p>

</footer>

</body>

</html>
